name: Pipeline DevSecOps

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks - scan des secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action v2.3.9, fixee par son hash de commit
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarcloud:
    name: SonarCloud - analyse du code (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # sonarqube-scan-action v8.5.0, fixee par son hash de commit
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  snyk:
    name: Snyk - analyse des dependances (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dependances
        run: pip install --only-binary ":all:" --require-hashes -r app/requirements.txt
      # snyk/actions/setup v1.0.0, fixee par son hash de commit
      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04
      - name: Scan Snyk (bloque si HIGH ou CRITICAL)
        run: snyk test --file=app/requirements.txt --package-manager=pip --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  checkov:
    name: Checkov - scan de l'infrastructure (IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Checkov
        run: pip install checkov==3.4.5
      - name: Scan Checkov (bloque si une regle echoue)
        run: checkov -d infra --framework terraform --quiet --compact

  build-scan:
    name: Build + Trivy + ZAP + push ECR
    runs-on: ubuntu-latest
    needs: [gitleaks, checkov, sonarcloud, snyk]
    env:
      IMAGE: securecloud-app:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t "$IMAGE" .

      # trivy-action v0.35.0, fixee par son hash de commit (version saine apres l'attaque de mars 2026)
      - name: Scan Trivy (bloque si HIGH ou CRITICAL corrigeable)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ env.IMAGE }}
          version: v0.69.3
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Lancer l'application pour le test dynamique
        run: |
          docker run -d --name app -p 5000:5000 "$IMAGE"
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1

      # action-baseline v0.15.0, fixee par son hash de commit
      - name: Scan OWASP ZAP (DAST)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: http://localhost:5000
          allow_issue_writing: false
          fail_action: false
          artifact_name: rapport-zap

      # La suite ne s'execute que pour un push sur main (pas pour une pull request)
      # actions/configure-aws-credentials v6.3.0, fixee par son hash de commit
      - name: Identifiants AWS (Learner Lab)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Pousser l'image dans ECR (seulement si tous les scans sont passes)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT.dkr.ecr.us-east-1.amazonaws.com"
          REMOTE="$REGISTRY/securecloud-pme-app:${{ github.sha }}"
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$REGISTRY"
          if aws ecr describe-images --repository-name securecloud-pme-app --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "Image deja presente dans ECR (tags immuables), rien a pousser."
          else
            docker tag "$IMAGE" "$REMOTE"
            docker push "$REMOTE"
          fi

  deploy:
    name: Deploiement production (ECS)
    runs-on: ubuntu-latest
    needs: build-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # L'environnement "production" exige une approbation manuelle sur GitHub
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Nouvelle version de la definition de tache avec la nouvelle image
        id: taskdef
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          NEW_IMAGE="$ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/securecloud-pme-app:${{ github.sha }}"
          aws ecs describe-task-definition --task-definition securecloud-pme-task --query taskDefinition > td.json
          jq --arg IMG "$NEW_IMAGE" '.containerDefinitions[0].image = $IMG
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' td.json > td-new.json
          ARN=$(aws ecs register-task-definition --cli-input-json file://td-new.json \
                  --query taskDefinition.taskDefinitionArn --output text)
          echo "Nouvelle definition : $ARN"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Mettre a jour le service ECS et attendre qu'il soit stable
        run: |
          aws ecs update-service --cluster securecloud-pme-cluster \
            --service securecloud-pme-service \
            --task-definition "${{ steps.taskdef.outputs.arn }}" > /dev/null
          aws ecs wait services-stable --cluster securecloud-pme-cluster --services securecloud-pme-service
          echo "Deploiement termine."
